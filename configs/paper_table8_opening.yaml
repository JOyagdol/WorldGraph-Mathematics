# The Table 8 entry point applies shared_wall_or_single_opening_v1 to these
# exact component scores. The reference requires the map-derived support ledger.
method:
  version: joint_evidence_v1_proposed
  alpha: 1.0
  beta: 1.0
  anchor_threshold: 0.0
  max_states: 100000
  solver_mode: exact_reference
  score_tie_decimals: 12
  missing_stored_metadata: report_error
  node_scoring_labels: [Furniture, Installation, Opening]
  category_weight: room_idf
  relation_compatibility:
    ADJACENT_TO: [TOUCHES, INTERSECTS]
    TOUCHES: [INTERSECTS]
  symmetric_relations: [ADJACENT_TO, TOUCHES, INTERSECTS, ADJACENT_SURFACE]
  inverse_relations:
    ABOVE: BELOW
    BELOW: ABOVE
variants: [full, objects_only, relations_only]
timing:
  warmup: 0
  repeat: 1
  seed: 0
  reference_cache: preload
  primary: warm_online_retrieval
protocol:
  task: closed_set_single_gt_room
  experiment_stage: paper_table8_shared_wall_or_single_opening
  input_condition: researcher_curated
  oracle_validation_status: pending
  require_full_ranking: true
  mtr_policy: N_plus_1_on_retrieval_abstention
